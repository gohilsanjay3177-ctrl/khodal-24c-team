ton></div>`:''}</div>`).join(''):'<p class="muted">હજુ Expenses નથી.</p>'}function filterFunds(){let s=($('#fundsearch')?.value||'').toLowerCase(),m=$('#historymonth')?.value||'';return funds.filter(f=>(!s||nameOf(f.member_id).toLowerCase().includes(s))&&(!m||f.fund_month===m+'-01'))}function renderPending(mon){let list=members.filter(m=>m.active!==false&&!funds.some(f=>f.member_id===m.id&&f.status==='Paid'&&f.fund_month===mon+'-01'));$('#pendinglist').innerHTML=`<p>${list.length} સભ્યોનું ${esc(mon)} મહિનાનું ફંડ બાકી છે.</p>`+(list.length?list.map(m=>`<div class="list"><b>${esc(m.full_name)}</b><div class="muted">મોબાઇલ: ${esc(m.phone||'ઉમેર્યો નથી')}</div><div class="muted">આ મહિના માટે નોંધાયેલ ચુકવણી નથી.</div><button class="btn" data-member-profile="${m.id}">સભ્યની પ્રોફાઇલ જુઓ</button> <button class="btn" data-whatsapp="${m.id}">WhatsApp યાદ અપાવો</button></div>`).join(''):'<p class="muted">કોઈ Pending Member નથી.</p>');$('#pendinglist').querySelectorAll('[data-member-profile]').forEach(b=>b.onclick=()=>{let m=members.find(x=>String(x.id)===b.dataset.memberProfile);if(m){selectedMemberId=m.id;page='memberprofile';render()}});$('#pendinglist').querySelectorAll('[data-whatsapp]').forEach(b=>b.onclick=()=>{let m=members.find(x=>String(x.id)===b.dataset.whatsapp);if(!m)return;let phone=String(m.whatsapp||m.phone||'').replace(/\D/g,'');if(phone.length===10)phone='91'+phone;if(!phone)return toast('આ સભ્યનો WhatsApp નંબર ઉમેરો.',true);let msg=`જય ખોડલ માં 🙏 ${m.full_name}, Khodal 24C Team તરફથી ${$('#monthpick')?.value||month().slice(0,7)} મહિનાનું ફંડ બાકી છે. કૃપા કરીને જમા કરાવશો. આભાર.`;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank')})}
document.addEventListener('appnav',e=>navigate(e.detail));function navigate(p){if(p!==page)previousPage=page;const sharedReadPages=['profile','history','dashboard','settings','members','expenses','reports','pending','memberprofile'];if(!admin()&&!sharedReadPages.includes(p)){toast('આ પેજ માટે Admin Permission જરૂરી છે.',true);return}page=p;render()}async function login(e){e.preventDefault();if(busy)return;busy=true;render();let fd=new FormData(e.target);try{let loginId=String(fd.get('email')||'').trim();let email=loginId.toLowerCase()==='khodal24c'?'members@khodal24c.team':loginId;let {data,error}=await sb.auth.signInWithPassword({email,password:fd.get('password')});if(error)throw error;session=data.session;await loadData()}catch(err){toast(err.message||'Login નિષ્ફળ થયું.',true)}finally{busy=false;render()}}async function forgot(){let email=prompt('તમારું Account Email દાખલ કરો');if(!email)return;let {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});if(error)toast(error.message,true);else toast('Password reset email મોકલ્યો.')}async function logout(){await sb.auth.signOut();session=null;profile=null;members=[];funds=[];expenses=[];page='login';render();toast('Logout થયું.')}async function loadData(){if(!session)return;try{let uid=session.user.id;let [pr,rr,mm,ff,ee]=await Promise.all([sb.from('profiles').select('*').eq('id',uid).maybeSingle(),sb.from('user_roles').select('role').eq('user_id',uid).maybeSingle(),sb.from('members').select('*').order('full_name'),sb.from('fund_entries').select('*').order('payment_date',{ascending:false}),sb.from('expenses').select('*').order('expense_date',{ascending:false})]);for(let x of [pr,rr,mm,ff,ee])if(x.error)throw x.error;profile=pr.data;const isSharedMember=String(session.user.email||'').toLowerCase()==='members@khodal24c.team';role=rr.data?.role||(isSharedMember?'member':'member');members=mm.data||[];funds=ff.data||[];expenses=ee.data||[];if(!admin()&&!isSharedMember){let mine=members.find(m=>m.auth_user_id===uid);members=mine?[mine]:[];funds=funds.filter(f=>mine&&f.member_id===mine.id);expenses=[];page='history'}else page='dashboard';render()}catch(err){toast('Database Error: '+(err.message||'કનેક્શન તપાસો'),true);render()}}async function addMember(e){e.preventDefault();if(busy)return;busy=true;let f=new FormData(e.target);try{let {error}=await sb.from('members').insert({full_name:f.get('full_name').trim(),phone:f.get('phone').trim(),whatsapp:f.get('whatsapp').trim()});if(error)throw error;toast('Member સાચવ્યો.');await loadData()}catch(err){toast(err.message,true)}finally{busy=false}}async function addFund(e){e.preventDefault();if(busy)return;busy=true;let f=new FormData(e.target),fm=f.get('fund_month')+'-01';try{let {error}=await sb.from('fund_entries').insert({member_id:f.get('member_id'),amount:Number(f.get('amount')),fund_month:fm,payment_date:f.get('payment_date'),payment_time:f.get('payment_time'),payment_method:f.get('payment_method'),status:f.get('status'),note:f.get('note').trim(),created_by:session.user.id});if(error)throw error;toast('Fund Entry સાચવી.');page='history';await loadData()}catch(err){toast(err.message,true)}finally{busy=false;render()}}async function addExpense(e){e.preventDefault();if(busy)return;busy=true;let f=new FormData(e.target);try{let {error}=await sb.from('expenses').insert({title:f.get('title').trim(),amount:Number(f.get('amount')),expense_date:f.get('expense_date'),paid_to:f.get('paid_to').trim(),description:f.get('description').trim(),created_by:session.user.id});if(error)throw error;toast('Expense સાચવ્યો.');await loadData();page='expenses';render()}catch(err){toast(err.message,true)}finally{busy=false}}function csv(type,rows){let header=type==='funds'?['Member','Fund Month','Amount','Date','Time','Method','Status','Note']:type==='expenses'?['Date','Title','Amount','Paid To','Description']:['Member','Month','Total Paid','Entries','Last Payment Date','Status'];let txt='\ufeff'+[header,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='khodal24c-'+type+'.csv';a.click();URL.revokeObjectURL(u)}

})();</script><nav id="nav" class="nav"><button data-page="dashboard" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'dashboard'}))"><b>⌂</b>હોમ</button><button data-page="members" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'members'}))"><b>♙</b>સભ્યો</button><button data-page="fund" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'fund'}))"><b>₹</b>Fund</button><button data-page="expenses" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'expenses'}))"><b>↗</b>ખર્ચ</button><button data-page="settings" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'settings'}))"><b>⚙</b>સેટિંગ્સ</button></nav><script>document.addEventListener('nav',e=>{const p=e.detail;const ev=new CustomEvent('appnav',{detail:p});document.dispatchEvent(ev)})</script></body></html>
