<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06172c"><title>Khodal 24C Team</title><style>

function toast(s,err=false){let t=$('#toast');t.textContent=s;t.classList.toggle('err',err);t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function admin(){return role==='admin'||role==='super_admin'}function title(t){return `<div class="head"><h2>${t}</h2><span class="tag">${esc(role.replace('_',' ').toUpperCase())}</span></div>`}function field(label,name,type='text',required=true,extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${required?'required':''} ${extra}></div>`}
function render(){let a=$('#app');if($('#nav'))$('#nav').classList.toggle('hidden',!session);if(!session){a.innerHTML=`<section class="card" style="max-width:440px;margin:7vh auto"><div class="brand">✺<br>KHODAL 24C<br>TEAM</div><p style="text-align:center" class="muted">Together for Better Tomorrow</p><h2>Supabase Login</h2><p class="muted">તમારા Supabase Authentication Account થી Login કરો.</p><form id="login">${field('Email Address','email','email')}${field('Password','password','password')}<button class="btn gold" style="width:100%" ${busy?'disabled':''}>${busy?'લૉગિન થઈ રહ્યું છે…':'Login'}</button></form><p class="muted">Password ભૂલી ગયા? <button class="btn" id="forgot">Reset Email મોકલો</button></p></section>`;$('#login').onsubmit=login;$('#forgot').onclick=forgot;return}let body='';if(page==='dashboard'){const paid=funds.filter(x=>x.status==='Paid').reduce((s,x)=>s+Number(x.amount),0),exp=expenses.reduce((s,x)=>s+Number(x.amount),0),cur=funds.filter(x=>x.status==='Paid'&&x.fund_month===month()).reduce((s,x)=>s+Number(x.amount),0),pending=members.filter(m=>m.active&&!funds.some(f=>f.member_id===m.id&&f.status==='Paid'&&f.fund_month===month())).length;body=`${title('Dashboard')}<div class="grid"><div class="stat"><small>Total Members</small><strong>${members.length}</strong></div><div class="stat"><small>Total Fund Received</small><strong>${money(paid)}</strong></div><div class="stat"><small>Current Month Fund</small><strong>${money(cur)}</strong></div><div class="stat"><small>Pending Members</small><strong>${pending}</strong></div><div class="stat"><small>Total Expenses</small><strong>${money(exp)}</strong></div><div class="stat"><small>Available Balance</small><strong>${money(paid-exp)}</strong></div></div><section class="card"><h3>Quick Actions</h3><div class="row"><button class="btn" data-page="members">Members</button><button class="btn gold" data-page="fund">Add Fund</button><button class="btn" data-page="pending">Pending</button><button class="btn" data-page="history">Fund History</button><button class="btn" data-page="expenses">Expenses</button><button class="btn" data-page="reports">Reports</button></div></section>`}
else if(page==='members'){body=`${title('Members')}<input id="search" placeholder="Search member..." class="field" style="width:100%;padding:12px;background:#06172c;color:white;border:1px solid var(--line);border-radius:10px">${admin()?`<form id="addmember" class="card"><h3>Add Member</h3>${field('Full Name','full_name')}${field('Phone','phone','tel',false)}${field('WhatsApp','whatsapp','tel',false)}<button class="btn gold">Save Member</button></form>`:''}<section class="card" id="memberlist">${memberRows(members)}</section>`}
else if(page==='fund'){if(!admin()){body=title('Fund Entry')+'<p class="card">આ પેજ માટે Admin Permission જરૂરી છે.</p>'}else body=`${title('Add Fund Entry')}<form id="fundform" class="card"><div class="field"><label>Select Member</label><select name="member_id" required>${members.filter(m=>m.active).map(m=>`<option value="${m.id}">${esc(m.full_name)}</option>`).join('')}</select></div>${field('Amount (₹)','amount','number',true,'min="0.01" step="0.01"')}<div class="field"><label>Fund Month</label><input name="fund_month" type="month" value="${month().slice(0,7)}" required></div>${field('Payment Date','payment_date','date',true,`value="${today()}"`)}${field('Payment Time','payment_time','time',true,`value="${new Date().toTimeString().slice(0,5)}"`)}<div class="field"><label>Payment Method</label><select name="payment_method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Other</option></select></div><div class="field"><label>Status</label><select name="status"><option>Paid</option><option>Pending</option></select></div><div class="field"><label>Note</label><textarea name="note"></textarea></div><button class="btn gold" ${busy?'disabled':''}>Save Fund</button></form>`}
else if(page==='pending'){let mon=$('#monthpick')?.value||month().slice(0,7);body=`${title('Pending Fund')}<div class="field"><label>Select Month</label><input id="monthpick" type="month" value="${mon}"></div><section class="card" id="pendinglist"></section>`}

else if(page==='expenses'){body=`${title('Expenses')}${admin()?`<form id="expenseform" class="card"><h3>Add Expense</h3>${field('Expense Title','title')}${field('Amount','amount','number',true,'min="0.01" step="0.01"')}${field('Expense Date','expense_date','date',true,`value="${today()}"`)}${field('Paid To','paid_to','text',false)}<div class="field"><label>Description</label><textarea name="description"></textarea></div><button class="btn gold">Save Expense</button></form>`:''}<section class="card" id="expenselist">${expenseRows(expenses)}</section><button class="btn" id="csvexp">Export CSV</button>`}
else if(page==='reports'){let paid=funds.filter(x=>x.status==='Paid').reduce((s,x)=>s+Number(x.amount),0),ex=expenses.reduce((s,x)=>s+Number(x.amount),0);body=`${title('Reports')}<div class="grid"><div class="stat"><small>Total Fund</small><strong>${money(paid)}</strong></div><div class="stat"><small>Total Expenses</small><strong>${money(ex)}</strong></div><div class="stat"><small>Balance</small><strong>${money(paid-ex)}</strong></div><div class="stat"><small>Members</small><strong>${members.length}</strong></div></div><button class="btn" onclick="print()">Print / Save PDF</button><button class="btn" id="csvreport">Export Month CSV</button>`}

a.innerHTML=`<header class="head"><div class="brand" style="font-size:18px">✺ KHODAL 24C TEAM</div><button class="btn" id="refresh">↻ Refresh</button></header>${body}`;a.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#refresh').onclick=loadData;if($('#addmember'))$('#addmember').onsubmit=addMember;if($('#fundform'))$('#fundform').onsubmit=addFund;if($('#expenseform'))$('#expenseform').onsubmit=addExpense;if($('#search'))$('#search').oninput=()=>$('#memberlist').innerHTML=memberRows(members.filter(m=>m.full_name.toLowerCase().includes($('#search').value.toLowerCase())||m.phone.includes($('#search').value)));if($('#monthpick')){$('#monthpick').onchange=()=>renderPending($('#monthpick').value);renderPending($('#monthpick').value)}if($('#fundsearch'))$('#fundsearch').oninput=()=>$('#fundlist').innerHTML=fundRows(filterFunds());if($('#historymonth'))$('#historymonth').onchange=()=>$('#fundlist').innerHTML=fundRows(filterFunds());if($('#csvfund'))$('#csvfund').onclick=()=>csv('funds',filterFunds().map(f=>[nameOf(f.member_id),f.fund_month,f.amount,f.payment_date,f.payment_time,f.payment_method,f.status,f.note]));if($('#csvexp'))$('#csvexp').onclick=()=>csv('expenses',expenses.map(e=>[e.expense_date,e.title,e.amount,e.paid_to,e.description]));if($('#csvreport'))$('#csvreport').onclick=()=>csv('report',members.map(m=>{let fs=funds.filter(f=>f.member_id===m.id&&f.fund_month===month()&&f.status==='Paid');return[m.full_name,month(),fs.reduce((s,f)=>s+Number(f.amount),0),fs.length,fs.map(f=>f.payment_date).sort().reverse()[0]||'',fs.length?'Paid':'Unpaid']}));if($('#logout'))$('#logout').onclick=logout;if($('#resetpass'))$('#resetpass').onclick=forgot; }
function memberRows(arr){return arr.length?arr.map(m=>`<div class="list"><b>${esc(m.full_name)}</b><div class="muted">${esc(m.phone||'Phone not added')} · ${m.active?'Active':'Inactive'} · Fund paid ${money(funds.filter(f=>f.member_id===m.id&&f.status==='Paid').reduce((s,f)=>s+Number(f.amount),0))}</div>${m.phone?`<a style="color:var(--gold)" href="tel:${esc(m.phone)}">Call</a>`:''}</div>`).join(''):'<p class="muted">No members found.</p>'}function nameOf(id){return members.find(m=>m.id===id)?.full_name||'Unknown'}function fundRows(arr){return arr.length?arr.slice().sort((a,b)=>(b.payment_date||'').localeCompare(a.payment_date||'')).map(f=>`<div class="list"><b>${esc(nameOf(f.member_id))} · ${money(f.amount)}</b><div class="muted">${esc(f.fund_month)} · ${esc(f.payment_date)} ${esc(f.payment_time||'')} · ${esc(f.payment_method)} · ${esc(f.status)}</div>${esc(f.note||'')}</div>`).join(''):'<p class="muted">હજુ Fund Entries નથી.</p>'}function expenseRows(arr){return arr.length?arr.slice().sort((a,b)=>b.expense_date.localeCompare(a.expense_date)).map(e=>`<div class="list"><b>${esc(e.title)} · ${money(e.amount)}</b><div class="muted">${esc(e.expense_date)} · ${esc(e.paid_to||'')}</div>${esc(e.description||'')}</div>`).join(''):'<p class="muted">હજુ Expenses નથી.</p>'}function filterFunds(){let s=($('#fundsearch')?.value||'').toLowerCase(),m=$('#historymonth')?.value||'';return funds.filter(f=>(!s||nameOf(f.member_id).toLowerCase().includes(s))&&(!m||f.fund_month===m+'-01'))}function renderPending(mon){let list=members.filter(m=>m.active&&!funds.some(f=>f.member_id===m.id&&f.status==='Paid'&&f.fund_month===mon+'-01'));$('#pendinglist').innerHTML=`<p>${list.length} members pending for ${esc(mon)}</p>`+(list.length?list.map(m=>`<div class="list"><b>${esc(m.full_name)}</b><div class="muted">${esc(m.phone||'')}</div><button class="btn" data-wa="${m.id}">WhatsApp Reminder</button></div>`).join(''):'<p class="muted">કોઈ Pending Member નથી.</p>');$('#pendinglist').querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{let m=members.find(x=>x.id===b.dataset.wa),n=(m.whatsapp||m.phone||'').replace(/\D/g,'');if(n.length===10)n='91'+n;if(!n)return toast('Phone/WhatsApp number ઉમેરો.',true);let msg=`નમસ્તે ${m.full_name} ભાઈ 🙏\n\nKhodal 24C Team તરફથી યાદ અપાવવાનું કે ${mon} મહિનાનું તમારું Fund હજી નોંધાયું નથી.\n\nજો તમે Fund આપી દીધું હોય તો કૃપા કરીને Admin ને જાણ કરશો.\n\nઆભાર 🙏`;open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')})}
document.addEventListener('appnav',e=>navigate(e.detail));function navigate(p){if(!admin()&&!['profile','history','dashboard'].includes(p)){toast('આ પેજ માટે Admin Permission જરૂરી છે.',true);return}page=p;render()}async function login(e){e.preventDefault();if(busy)return;busy=true;render();let fd=new FormData(e.target);try{let {data,error}=await sb.auth.signInWithPassword({email:fd.get('email').trim(),password:fd.get('password')});if(error)throw error;session=data.session;await loadData()}catch(err){toast(err.message||'Login નિષ્ફળ થયું.',true)}finally{busy=false;render()}}async function forgot(){let email=prompt('તમારું Account Email દાખલ કરો');if(!email)return;let {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});if(error)toast(error.message,true);else toast('Password reset email મોકલ્યો.')}async function logout(){await sb.auth.signOut();session=null;profile=null;members=[];funds=[];expenses=[];page='login';render();toast('Logout થયું.')}async function loadData(){if(!session)return;try{let uid=session.user.id;let [pr,rr,mm,ff,ee]=await Promise.all([sb.from('profiles').select('*').eq('id',uid).maybeSingle(),sb.from('user_roles').select('role').eq('user_id',uid).maybeSingle(),sb.from('members').select('*').order('full_name'),sb.from('fund_entries').select('*').order('payment_date',{ascending:false}),sb.from('expenses').select('*').order('expense_date',{ascending:false})]);for(let x of [pr,rr,mm,ff,ee])if(x.error)throw x.error;profile=pr.data;role=rr.data?.role||'member';if(!rr.data){toast('તમારા Account નો Role મળ્યો નથી. Supabase user_roles માટેની RLS policy લાગુ કરો.',true)}members=mm.data||[];funds=ff.data||[];expenses=ee.data||[];if(!admin()){let mine=members.find(m=>m.auth_user_id===uid);members=mine?[mine]:[];funds=funds.filter(f=>mine&&f.member_id===mine.id);expenses=[];page='history'}else page='dashboard';render()}catch(err){toast('Database Error: '+(err.message||'કનેક્શન તપાસો'),true);render()}}async function addMember(e){e.preventDefault();if(busy)return;busy=true;let f=new FormData(e.target);try{let {error}=await sb.from('members').insert({full_name:f.get('full_name').trim(),phone:f.get('phone').trim(),whatsapp:f.get('whatsapp').trim()});if(error)throw error;toast('Member સાચવ્યો.');await loadData()}catch(err){toast(err.message,true)}finally{busy=false}}async function addFund(e){e.preventDefault();if(busy)return;busy=true;let f=new FormData(e.target),fm=f.get('fund_month')+'-01';try{let {error}=await sb.from('fund_entries').insert({member_id:f.get('member_id'),amount:Number(f.get('amount')),fund_month:fm,payment_date:f.get('payment_date'),payment_time:f.get('payment_time'),payment_method:f.get('payment_method'),status:f.get('status'),note:f.get('note').trim(),created_by:session.user.id});if(error)throw error;toast('Fund Entry સાચવી.');page='history';await loadData()}catch(err){toast(err.message,true)}finally{busy=false;render()}}async function addExpense(e){e.preventDefault();if(busy)return;busy=true;let f=new FormData(e.target);try{let {error}=await sb.from('expenses').insert({title:f.get('title').trim(),amount:Number(f.get('amount')),expense_date:f.get('expense_date'),paid_to:f.get('paid_to').trim(),description:f.get('description').trim(),created_by:session.user.id});if(error)throw error;toast('Expense સાચવ્યો.');await loadData();page='expenses';render()}catch(err){toast(err.message,true)}finally{busy=false}}function csv(type,rows){let header=type==='funds'?['Member','Fund Month','Amount','Date','Time','Method','Status','Note']:type==='expenses'?['Date','Title','Amount','Paid To','Description']:['Member','Month','Total Paid','Entries','Last Payment Date','Status'];let txt='\ufeff'+[header,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='khodal24c-'+type+'.csv';a.click();URL.revokeObjectURL(u)}
sb.auth.getSession().then(({data})=>{session=data.session;if(session)loadData();else render()});sb.auth.onAuthStateChange((_event,s)=>{session=s;if(!s){profile=null;render()}else if(!members.length)loadData()});
})();</script><nav id="nav" class="nav"><button data-page="dashboard" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'dashboard'}))"><b>⌂</b>Home</button><button data-page="members" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'members'}))"><b>♙</b>Members</button><button data-page="fund" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'fund'}))"><b>₹</b>Fund</button><button data-page="pending" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'pending'}))"><b>◷</b>Pending</button><button data-page="profile" onclick="document.dispatchEvent(new CustomEvent('nav',{detail:'profile'}))"><b>☷</b>More</button></nav><script>document.addEventListener('nav',e=>{const p=e.detail;const ev=new CustomEvent('appnav',{detail:p});document.dispatchEvent(ev)})</script></body></html>
