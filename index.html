document.addEventListener('appnav',e=>navigate(e.detail));function navigate(p){const sharedReadPages=['profile','history','dashboard','settings','members','expenses','reports','pending','memberprofile'];if(!admin()&&!sharedReadPages.includes(p)){toast('આ પેજ માટે Admin Permission જરૂરી છે.',true);return}page=p;render()}async function login(e){e.preventDefault();if(busy)return;busy=true;render();let fd=new FormData(e.target);try{let loginId=String(fd.get('email')||'').trim();let email=loginId.toLowerCase()==='khodal24c'?'members@khodal24c.team':loginId;let {data,error}=await sb.auth.signInWithPassword({email,password:fd.get('password')});if(error)throw error;session=data.session;await loadData()}catch(err){toast(err.message||'Login નિષ્ફળ થયું.',true)}finally{busy=false;render()}}async function forgot(){let email=prompt('તમારું Account Email દાખલ કરો');if(!email)return;let {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});if(error)toast(error.message,true);else toast('Password reset email મોકલ્યો.')}async function logout(){await sb.auth.signOut();session=null;profile=null;members=[];funds=[];expenses=[];page='login';render();toast('Logout થયું.')}async function loadData(){if(!session)return;try{let uid=session.user.id;let [pr,rr,mm,ff,ee]=await Promise.all([sb.from('profiles').select('*').eq('id',uid).maybeSingle(),sb.from('user_roles').select('role').eq('user_id',uid).maybeSingle(),sb.from('members').select('*').order('full_name'),sb.from('fund_entries').select('*').order('payment_date',{ascending:false}),sb.from('expenses').select('*').order('expense_date',{ascending:false})]);for(let x of [pr,rr,mm,ff,ee])if(x.error)throw x.error;profile=pr.data;const isSharedMember=String(session.user.email||'').toLowerCase()==='members@khodal24c.team';role=rr.data?.role||(isSharedMember?'member':'member');members=mm.data||[];funds=ff.data||[];expenses=ee.data||[];if(!admin()&&!isSharedMember){let mine=members.find(m=>m.auth_user_id===uid);members=mine
