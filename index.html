<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101e36">
<title>Khodal 24c Team</title>
<style>
:root{--navy:#101e36;--navy2:#1b2d4a;--gold:#e4bd68;--bg:#f3f5f9;--white:#fff;--text:#202b3c;--muted:#748096;--border:#e4e8ef;--green:#16845b;--red:#c43e4d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#101e36,#304b70)}.login-card{background:white;width:100%;max-width:420px;padding:28px;border-radius:22px;box-shadow:0 20px 65px #0003}.brand-mark{background:var(--navy);color:var(--gold);display:grid;place-items:center;width:66px;height:66px;border-radius:20px;font-size:26px;font-weight:900;margin-bottom:15px}h1,h2,h3,p{margin-top:0}.login-card h1{font-size:25px;margin-bottom:5px}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:10px;padding:12px;background:white;color:var(--text)}input:focus,select:focus,textarea:focus{outline:2px solid #e4bd6880;border-color:var(--gold)}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750}.btn-gold{background:var(--gold);color:var(--navy)}.btn-dark{background:var(--navy);color:white}.btn-light{background:#eef1f6;color:var(--navy)}.btn-danger{background:#ffebed;color:var(--red)}.full{width:100%;margin-top:18px}.message{font-size:13px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--red)}.success{color:var(--green)}
.topbar{background:var(--navy);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--gold)}.topbar h2{margin:0;font-size:18px}.topbar small{color:var(--gold)}.user-info{text-align:right;font-size:12px;overflow-wrap:anywhere}.layout{display:flex;min-height:calc(100dvh - 68px)}.sidebar{width:215px;flex-shrink:0;padding:16px 12px;background:var(--navy2)}.nav-btn{width:100%;text-align:left;padding:12px;margin-bottom:5px;border:0;border-radius:9px;color:#e6eaf1;background:transparent}.nav-btn.active,.nav-btn:hover{background:#354767;color:var(--gold)}main{padding:22px;min-width:0;flex:1}.page-title{font-size:24px;margin-bottom:6px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.stat{background:white;border:1px solid var(--border);border-radius:15px;padding:18px;min-width:0}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:clamp(19px,2.5vw,27px);font-weight:850;margin-top:8px;overflow-wrap:anywhere}.gold-line{border-top:3px solid var(--gold)}.panel{background:white;padding:18px;border:1px solid var(--border);border-radius:15px;margin:16px 0;min-width:0}.panel h3{font-size:17px;margin-bottom:14px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{flex:1;min-width:130px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.span-2{grid-column:span 2}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{background:#f6f7fa;color:#526078}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:750}.paid{background:#e0f5e9;color:#087443}.unpaid{background:#fff0d8;color:#8b5800}.inactive{background:#eee;color:#555}.empty{padding:24px;text-align:center;color:var(--muted)}.notice{padding:12px;background:#fff7e7;border-radius:9px;color:#76531a;font-size:13px;margin-bottom:14px}.mobile-nav{display:none}.actions{display:flex;gap:6px}.actions .btn{padding:7px 9px;font-size:12px}.inline{display:flex;gap:8px;align-items:center}.inline>*{flex:1}.subheading{margin:20px 0 8px;font-size:15px}
@media(max-width:760px){.layout{display:block}.sidebar{display:none}main{padding:14px;padding-bottom:90px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px}.topbar{padding:12px 14px}.topbar h2{font-size:16px}.user-info{max-width:48%}.mobile-nav{display:flex;overflow-x:auto;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--navy);border-top:2px solid var(--gold);padding:7px;gap:5px}.mobile-nav .nav-btn{width:auto;flex:0 0 auto;margin:0;font-size:12px;padding:10px}.panel{padding:13px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.page-title{font-size:21px}}
</style>
</head>
<body>
<section id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand-mark">K24</div><h1>Khodal 24c Team</h1><p class="muted">Member Management Portal</p>
    <form id="loginForm">
      <label for="email">Email Address</label><input id="email" type="email" autocomplete="username" required placeholder="તમારું ઇમેઇલ">
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="તમારો પાસવર્ડ">
      <button id="loginButton" class="btn btn-gold full" type="submit">Login કરો</button>
      <div id="loginMessage" class="message" role="status"></div>
    </form>
  </div>
</section>
<div id="appScreen" class="hidden">
  <header class="topbar"><div><h2>Khodal <span style="color:var(--gold)">24c</span> Team</h2><small>સેવા • સહકાર • વિશ્વાસ</small></div><div class="user-info"><div id="userName">સભ્ય</div><div id="userRole" style="color:var(--gold)">Member</div><button id="logoutButton" class="btn btn-light" style="margin-top:6px;padding:5px 9px">Logout</button></div></header>
  <div class="layout"><aside id="desktopNav" class="sidebar"></aside><main><div id="globalMessage" class="message" role="status"></div><section id="pageContent"></section></main></div><nav id="mobileNav" class="mobile-nav"></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* STEP 1: Supabase Dashboard -> Project Settings -> API
   અહીં Project URL અને Publishable key મૂકો.
   Secret key / service_role key ક્યારેય અહીં ન મૂકવી. */
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
const CONFIGURED = SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR_") &&
  !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_") &&
  SUPABASE_PUBLISHABLE_KEY.length > 15;

let db=null,currentUser=null,profile=null,members=[],payments=[],expenses=[],paymentStatus=[],currentPage="dashboard";
let reportMonth=new Date().toISOString().slice(0,7);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(v)||0);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const monthNow=()=>today().slice(0,7);
const showMessage=(id,msg,type="")=>{$(id).textContent=msg;$(id).className="message "+type};
const isAdmin=()=>!!profile&&["admin","super_admin"].includes(profile.role);
const isSuperAdmin=()=>profile?.role==="super_admin";
function requireAdmin(){if(!isAdmin())throw Error("આ કામગીરી માટે Admin પરવાનગી જરૂરી છે.")}
function requireSuperAdmin(){if(!isSuperAdmin())throw Error("આ કામગીરી ફક્ત Super Admin કરી શકે છે.")}
function check(result){if(result.error)throw result.error;return result.data}
function roleName(r){return ({super_admin:"Super Admin",admin:"Admin",member:"Member"})[r]||r||"Member"}
function fmtDate(d){return d?esc(String(d).slice(0,10)):"—"}

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!CONFIGURED||!db){showMessage("loginMessage","પહેલાં કોડમાં Supabase Project URL અને Publishable Key મૂકો.","error");return}
 $("loginButton").disabled=true;showMessage("loginMessage","Login થઈ રહ્યું છે...");
 try{const r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)throw r.error;await loadApplication()}
 catch(err){showMessage("loginMessage","Login/profile સમસ્યા: "+err.message,"error")}
 finally{$("loginButton").disabled=false}
});
$("logoutButton").addEventListener("click",async()=>{
 if(!db)return;const r=await db.auth.signOut();if(r.error){showMessage("globalMessage",r.error.message,"error");return}
 currentUser=null;profile=null;$("appScreen").classList.add("hidden");$("loginScreen").classList.remove("hidden");
});
async function loadApplication(){
 const a=await db.auth.getUser();if(a.error||!a.data.user)throw a.error||Error("Login જરૂરી છે");currentUser=a.data.user;
 const p=await db.from("profiles").select("*").eq("id",currentUser.id).single();if(p.error)throw p.error;profile=p.data;
 if(!profile.is_active){await db.auth.signOut();throw Error("તમારું એકાઉન્ટ Active નથી. Admin નો સંપર્ક કરો.")}
 $("userName").textContent=profile.full_name||currentUser.email;$("userRole").textContent=roleName(profile.role);
 $("loginScreen").classList.add("hidden");$("appScreen").classList.remove("hidden");
 renderNavigation();await loadData();await navigate("dashboard");
}
async function loadData(){
 showMessage("globalMessage","ડેટા લોડ થઈ રહ્યો છે...");
 const results=await Promise.all([
  db.from("profiles").select("*").order("full_name"),
  db.from("payments").select("*").order("payment_date",{ascending:false}),
  db.from("expenses").select("*").order("expense_date",{ascending:false}),
  db.from("member_payment_status").select("*")
 ]);
 const errors=results.filter(r=>r.error);if(errors.length)throw Error(errors.map(r=>r.error.message).join(" | "));
 members=results[0].data||[];payments=results[1].data||[];expenses=results[2].data||[];paymentStatus=results[3].data||[];
 showMessage("globalMessage","");
}
async function refresh(){try{await loadData();await navigate(currentPage)}catch(e){showMessage("globalMessage","ડેટા લોડ કરવામાં ભૂલ: "+e.message,"error")}}
const navItems=[{id:"dashboard",label:"🏠 Dashboard"},{id:"members",label:"👥 Members",admin:true},{id:"payments",label:"💰 Payments",admin:true},{id:"expenses",label:"🧾 Expenses",admin:true},{id:"reports",label:"📊 Reports"},{id:"profile",label:"👤 Profile"}];
function renderNavigation(){
 const allowed=navItems.filter(n=>!n.admin||isAdmin()),markup=allowed.map(n=>`<button class="nav-btn ${currentPage===n.id?"active":""}" data-page="${n.id}">${n.label}</button>`).join("");
 $("desktopNav").innerHTML=markup;$("mobileNav").innerHTML=markup;
 document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.page)));
}
async function navigate(page){
 if(["members","payments","expenses"].includes(page)&&!isAdmin())page="dashboard";
 currentPage=page;renderNavigation();
 try{const map={dashboard:renderDashboard,members:renderMembers,payments:renderPayments,expenses:renderExpenses,reports:renderReports,profile:renderProfile};await map[page]()}
 catch(e){showMessage("globalMessage",e.message,"error")}
}
function paidPayments(list){return list.filter(p=>String(p.status||"paid").toLowerCase()==="paid")}
function paymentMonth(p){return String(p.payment_month||"").slice(0,7)}
function renderDashboard(){
 const m=monthNow(),active=members.filter(x=>x.is_active),mp=paidPayments(payments.filter(p=>paymentMonth(p)===m));
 const income=mp.reduce((s,p)=>s+Number(p.amount||0),0),me=expenses.filter(x=>String(x.expense_date||"").slice(0,7)===m),cost=me.reduce((s,x)=>s+Number(x.amount||0),0);
 const expected=active.reduce((s,x)=>s+Number(x.monthly_amount||0),0);
 $("pageContent").innerHTML=`<h1 class="page-title">Dashboard</h1><p class="muted">જય ખોડલ મા • ${esc(m)}</p>
 <div class="cards">
 <div class="stat gold-line"><div class="label">કુલ Active સભ્યો</div><div class="value">${active.length}</div></div>
 <div class="stat gold-line"><div class="label">આ મહિનાની આવક</div><div class="value">${money(income)}</div></div>
 <div class="stat"><div class="label">અંદાજિત બાકી ફાળો</div><div class="value">${money(Math.max(0,expected-income))}</div></div>
 <div class="stat"><div class="label">આ મહિનાનો ખર્ચ</div><div class="value">${money(cost)}</div></div>
 <div class="stat gold-line"><div class="label">આ મહિનાનું બેલેન્સ</div><div class="value">${money(income-cost)}</div></div>
 <div class="stat"><div class="label">કુલ ખર્ચ</div><div class="value">${money(expenses.reduce((s,x)=>s+Number(x.amount||0),0))}</div></div></div>
 <div class="panel"><h3>તાજેતરની ફાળાની એન્ટ્રીઓ</h3>${renderPaymentTable(payments.slice(0,8))}</div>
 <div class="notice">બાકી ફાળો હાલ Active સભ્યોના monthly_amount માંથી આ મહિનાની નોંધાયેલી paid entries બાદ કરીને અંદાજવામાં આવે છે. Joining date, start_month, અગાઉની બાકી અને હપ્તા માટે આ ગણતરીને તમારા ગ્રુપના નિયમ મુજબ સુધારવી જરૂરી છે.</div>`;
}
function memberName(id){return members.find(m=>m.id===id)?.full_name||"અજ્ઞાત સભ્ય"}
function renderPaymentTable(rows){
 if(!rows.length)return '<div class="empty">હજુ કોઈ ફાળાની એન્ટ્રી નથી.</div>';
 return `<div class="table-wrap"><table><thead><tr><th>સભ્ય</th><th>મહિનો</th><th>રકમ</th><th>તારીખ</th><th>રીત</th><th>Status</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(memberName(p.member_id))}</td><td>${esc(paymentMonth(p))}</td><td>${money(p.amount)}</td><td>${fmtDate(p.payment_date)}</td><td>${esc(p.payment_method||"—")}</td><td><span class="pill ${String(p.status||"paid").toLowerCase()==="paid"?"paid":"unpaid"}">${esc(p.status||"paid")}</span></td></tr>`).join("")}</tbody></table></div>`;
}
function renderMembers(){
 requireAdmin();
 $("pageContent").innerHTML=`<h1 class="page-title">સભ્યોનું મેનેજમેન્ટ</h1><p class="muted">સભ્યોની વિગતો જુઓ અને સુધારો.</p>
 <div class="panel"><h3>નવો સભ્ય / Profile ઉમેરો</h3><div class="notice">આ ફોર્મ પહેલેથી બનાવેલા Supabase Auth account માટે છે. Auth User ID (UUID) જરૂરી છે. આ ફોર્મ નવો Auth login બનાવતું નથી. નવા Auth accounts બનાવવા સુરક્ષિત Edge Function અથવા server-side પ્રક્રિયા જરૂરી છે.</div>
 <form id="memberForm"><div class="form-grid">
 <div class="span-2"><label>Auth User ID (UUID)</label><input name="id" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
 <div><label>સભ્યનું નામ</label><input name="full_name" required></div><div><label>ફોન નંબર</label><input name="phone_number"></div>
 <div><label>WhatsApp નંબર</label><input name="whatsapp_number"></div><div><label>માસિક ફાળો (₹)</label><input name="monthly_amount" type="number" min="0" step="0.01" required value="0"></div>
 <div><label>Joining Date</label><input name="joining_date" type="date" value="${today()}"></div><div><label>Start Month</label><input name="start_month" type="month" value="${monthNow()}"></div>
 <div><label>Role</label><select name="role"><option value="member">Member</option><option value="admin">Admin</option>${isSuperAdmin()?'<option value="super_admin">Super Admin</option>':""}</select></div>
 <div><label>Active?</label><select name="is_active"><option value="true">Active</option><option value="false">Inactive</option></select></div></div><button class="btn btn-gold full" type="submit">સભ્ય સાચવો</button><div id="memberMessage" class="message"></div></form></div>
 <div class="panel"><div class="toolbar"><h3 style="margin:0">સભ્યોની યાદી</h3><input id="memberSearch" placeholder="નામ / ફોન શોધો"></div><div id="memberTable"></div></div>`;
 const form=$("memberForm");
 form.addEventListener("submit",async e=>{
  e.preventDefault();try{requireAdmin();const f=new FormData(form),id=String(f.get("id")).trim();
   const data={id,full_name:String(f.get("full_name")).trim(),phone_number:String(f.get("phone_number")||"").trim()||null,whatsapp_number:String(f.get("whatsapp_number")||"").trim()||null,monthly_amount:Number(f.get("monthly_amount")||0),joining_date:f.get("joining_date")||null,start_month:f.get("start_month")||null,is_active:f.get("is_active")==="true"};
   const role=String(f.get("role"));if(role==="super_admin")requireSuperAdmin();data.role=role;
   const r=await db.from("profiles").insert(data);if(r.error)throw r.error;showMessage("memberMessage","સભ્યની વિગતો સાચવાઈ.","success");await refresh();
  }catch(err){showMessage("memberMessage","સાચવી શકાયું નથી: "+err.message,"error")}
 });
 $("memberSearch").addEventListener("input",drawMemberTable);drawMemberTable();
}
function drawMemberTable(){
 const q=($("memberSearch")?.value||"").toLowerCase();
 const rows=members.filter(m=>[m.full_name,m.phone_number,m.whatsapp_number].some(v=>String(v||"").toLowerCase().includes(q)));
 $("memberTable").innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>નામ</th><th>ફોન</th><th>માસિક ફાળો</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${esc(m.full_name)}</td><td>${esc(m.phone_number||"—")}</td><td>${money(m.monthly_amount)}</td><td>${esc(roleName(m.role))}</td><td><span class="pill ${m.is_active?"paid":"inactive"}">${m.is_active?"Active":"Inactive"}</span></td><td><div class="actions"><button class="btn btn-light" data-edit="${esc(m.id)}">Edit</button><button class="btn ${m.is_active?"btn-danger":"btn-light"}" data-toggle="${esc(m.id)}">${m.is_active?"Inactive":"Active"}</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">સભ્ય મળ્યો નથી.</div>';
 $("memberTable").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>editMember(b.dataset.edit)));
 $("memberTable").querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>toggleMember(b.dataset.toggle)));
}
async function editMember(id){
 const m=members.find(x=>x.id===id);if(!m)return;
 const name=prompt("સભ્યનું નામ:",m.full_name||"");if(name===null)return;
 const phone=prompt("ફોન નંબર:",m.phone_number||"");if(phone===null)return;
 const amount=prompt("માસિક ફાળો:",m.monthly_amount??0);if(amount===null)return;
 try{requireAdmin();const r=await db.from("profiles").update({full_name:name.trim(),phone_number:phone.trim()||null,monthly_amount:Number(amount)}).eq("id",id);if(r.error)throw r.error;await refresh()}
 catch(e){alert("સુધારો નિષ્ફળ: "+e.message)}
}
async function toggleMember(id){
 const m=members.find(x=>x.id===id);if(!m)return;
 if(!confirm(`${m.full_name} ને ${m.is_active?"Inactive":"Active"} કરવું છે?`))return;
 try{requireAdmin();const r=await db.from("profiles").update({is_active:!m.is_active}).eq("id",id);if(r.error)throw r.error;await refresh()}
 catch(e){alert("Status બદલાયો નથી: "+e.message)}
}
function renderPayments(){
 requireAdmin();
 const active=members.filter(m=>m.is_active);
 $("pageContent").innerHTML=`<h1 class="page-title">ફાળાની એન્ટ્રી</h1><div class="panel"><h3>નવી Payment નોંધો</h3><form id="paymentForm"><div class="form-grid">
 <div class="span-2"><label>સભ્ય</label><select name="member_id" required><option value="">સભ્ય પસંદ કરો</option>${active.map(m=>`<option value="${esc(m.id)}">${esc(m.full_name)} — ${esc(m.phone_number||"")}</option>`).join("")}</select></div>
 <div><label>રકમ (₹)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>ફાળો મહિનો</label><input name="payment_month" type="month" value="${monthNow()}" required></div>
 <div><label>ચુકવણી તારીખ</label><input name="payment_date" type="date" value="${today()}" required></div><div><label>ચુકવણીનો સમય</label><input name="payment_time" type="time"></div>
 <div><label>ચુકવણીની રીત</label><select name="payment_method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Other</option></select></div>
 <div><label>Status</label><select name="status"><option value="paid">Paid</option><option value="pending">Pending</option></select></div>
 <div class="span-2"><label>નોંધ</label><textarea name="note" rows="2"></textarea></div></div><button class="btn btn-gold full">Payment સાચવો</button><div id="paymentMessage" class="message"></div></form></div>
 <div class="panel"><h3>ફાળાની એન્ટ્રીઓ</h3>${renderPaymentTable(payments)}</div>`;
 $("paymentForm").addEventListener("submit",async e=>{
  e.preventDefault();try{requireAdmin();const f=new FormData(e.currentTarget);
   const row={member_id:f.get("member_id"),amount:Number(f.get("amount")),payment_month:monthStart(String(f.get("payment_month"))),payment_date:f.get("payment_date"),payment_time:f.get("payment_time")||null,payment_method:f.get("payment_method"),status:f.get("status"),note:String(f.get("note")||"").trim()||null,entered_by:currentUser.id};
   const r=await db.from("payments").insert(row);if(r.error)throw r.error;showMessage("paymentMessage","Payment સાચવાઈ.","success");await refresh();
  }catch(err){showMessage("paymentMessage","Payment સાચવી શકાયી નથી: "+err.message,"error")}
 });
}
function renderExpenses(){
 requireAdmin();
 $("pageContent").innerHTML=`<h1 class="page-title">ખર્ચનું મેનેજમેન્ટ</h1><div class="panel"><h3>નવો ખર્ચ ઉમેરો</h3><form id="expenseForm"><div class="form-grid">
 <div><label>ખર્ચનું નામ</label><input name="title" required></div><div><label>રકમ (₹)</label><input name="amount" type="number" min="0.01" step="0.01" required></div>
 <div><label>તારીખ</label><input name="expense_date" type="date" value="${today()}" required></div><div><label>કોને ચૂકવ્યું?</label><input name="paid_to"></div>
 <div class="span-2"><label>વર્ણન</label><textarea name="description" rows="2"></textarea></div></div><button class="btn btn-gold full">ખર્ચ સાચવો</button><div id="expenseMessage" class="message"></div></form></div>
 <div class="panel"><h3>ખર્ચની યાદી</h3>${renderExpenseTable(expenses)}</div>`;
 $("expenseForm").addEventListener("submit",async e=>{
  e.preventDefault();try{requireAdmin();const f=new FormData(e.currentTarget),row={title:String(f.get("title")).trim(),amount:Number(f.get("amount")),expense_date:f.get("expense_date"),paid_to:String(f.get("paid_to")||"").trim()||null,description:String(f.get("description")||"").trim()||null,entered_by:currentUser.id};
   const r=await db.from("expenses").insert(row);if(r.error)throw r.error;showMessage("expenseMessage","ખર્ચ સાચવાયો.","success");await refresh();
  }catch(err){showMessage("expenseMessage","ખર્ચ સાચવી શકાયો નથી: "+err.message,"error")}
 });
}
function renderExpenseTable(rows){
 if(!rows.length)return '<div class="empty">હજુ કોઈ ખર્ચ નથી.</div>';
 return `<div class="table-wrap"><table><thead><tr><th>તારીખ</th><th>ખર્ચ</th><th>રકમ</th><th>ચૂકવણી કોને</th><th>વર્ણન</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${fmtDate(x.expense_date)}</td><td>${esc(x.title)}</td><td>${money(x.amount)}</td><td>${esc(x.paid_to||"—")}</td><td>${esc(x.description||"—")}</td><td><button class="btn btn-light" data-expense-edit="${esc(x.id)}">Edit</button></td></tr>`).join("")}</tbody></table></div>`;
}
// Expense edits use prompts to avoid assuming extra database columns.
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-expense-edit]");if(!b)return;
 try{requireAdmin();const x=expenses.find(z=>String(z.id)===b.dataset.expenseEdit);if(!x)return;
  const title=prompt("ખર્ચનું નામ:",x.title||"");if(title===null)return;
  const amount=prompt("રકમ:",x.amount);if(amount===null)return;
  const date=prompt("તારીખ (YYYY-MM-DD):",String(x.expense_date||"").slice(0,10));if(date===null)return;
  const r=await db.from("expenses").update({title:title.trim(),amount:Number(amount),expense_date:date}).eq("id",x.id);if(r.error)throw r.error;await refresh()
 }catch(err){alert("ખર્ચ સુધારી શકાયો નથી: "+err.message)}
});
function renderReports(){
 const month=reportMonth,inc=paidPayments(payments.filter(p=>paymentMonth(p)===month)).reduce((s,p)=>s+Number(p.amount||0),0);
 const ex=expenses.filter(x=>String(x.expense_date||"").slice(0,7)===month).reduce((s,x)=>s+Number(x.amount||0),0);
 const monthRows=payments.filter(p=>paymentMonth(p)===month);
 $("pageContent").innerHTML=`<h1 class="page-title">Reports</h1><div class="panel"><label>મહિનો પસંદ કરો</label><div class="toolbar"><input id="reportMonth" type="month" value="${esc(month)}"><button id="refreshReport" class="btn btn-dark">Report જુઓ</button><button id="printReport" class="btn btn-light">Print / PDF</button></div>
 <div class="cards"><div class="stat gold-line"><div class="label">કુલ આવક</div><div class="value">${money(inc)}</div></div><div class="stat"><div class="label">કુલ ખર્ચ</div><div class="value">${money(ex)}</div></div><div class="stat gold-line"><div class="label">બેલેન્સ</div><div class="value">${money(inc-ex)}</div></div></div>
 <h3>ફાળાની વિગતો — ${esc(month)}</h3>${renderPaymentTable(monthRows)}
 <h3 class="subheading">ખર્ચની વિગતો</h3>${renderExpenseTable(expenses.filter(x=>String(x.expense_date||"").slice(0,7)===month))}</div>`;
 $("refreshReport").addEventListener("click",()=>{reportMonth=$("reportMonth").value||monthNow();navigate("reports")});
 $("printReport").addEventListener("click",()=>window.print());
}
function renderProfile(){
 $("pageContent").innerHTML=`<h1 class="page-title">મારી Profile</h1><div class="panel"><h3>Account વિગતો</h3>
 <p><strong>નામ:</strong> ${esc(profile.full_name||"—")}</p><p><strong>Email:</strong> ${esc(currentUser.email||"—")}</p>
 <p><strong>ફોન:</strong> ${esc(profile.phone_number||"—")}</p><p><strong>WhatsApp:</strong> ${esc(profile.whatsapp_number||"—")}</p>
 <p><strong>Role:</strong> ${esc(roleName(profile.role))}</p><p><strong>સ્થિતિ:</strong> ${profile.is_active?"Active":"Inactive"}</p>
 <p><strong>માસિક ફાળો:</strong> ${money(profile.monthly_amount)}</p></div>
 ${!isAdmin()?`<div class="panel"><h3>મારી Payment History</h3>${renderPaymentTable(payments.filter(p=>p.member_id===currentUser.id))}</div>`:""}`;
}
async function init(){
 if(!CONFIGURED){showMessage("loginMessage","કોડમાં SUPABASE_URL અને SUPABASE_PUBLISHABLE_KEY ભરો. Secret key ન મૂકવી.","error");return}
 if(!window.supabase){showMessage("loginMessage","Supabase SDK લોડ ન થયું. ઇન્ટરનેટ તપાસો.","error");return}
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;profile=null;$("appScreen").classList.add("hidden");$("loginScreen").classList.remove("hidden")}});
 const s=await db.auth.getSession();
 if(s.data.session){try{await loadApplication()}catch(e){showMessage("loginMessage","Session/profile error: "+e.message,"error")}}
}
init();
</script>
</body>
</html>
