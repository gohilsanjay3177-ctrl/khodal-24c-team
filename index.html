<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06172c"><title>Khodal 24C Team</title>
<style>
:root{--bg:#06172c;--panel:#0b2340;--panel2:#102d50;--line:#204b70;--gold:#f1c66b;--gold2:#d99d35;--text:#f4f7fc;--muted:#9db1c9;--green:#20c987;--red:#ff6277;--blue:#4ba8ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#041226,#092342 60%,#06172c);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.app{max-width:1100px;margin:auto;padding:14px 14px 90px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:42px;height:42px;border:1px solid var(--gold);border-radius:14px;display:grid;place-items:center;color:var(--gold);font-size:21px;background:#102b49}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}.iconbtn,.btn,.navbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 13px}.btn.gold{background:linear-gradient(180deg,#ffdc89,#dba846);color:#1b1c20;border:0;font-weight:800}.btn.danger{border-color:#743247;color:#ff9aab}.btn.success{border-color:#147d5c;color:#74f0bd}.btn.small{padding:7px 9px;font-size:12px;border-radius:9px}.btnrow{display:flex;flex-wrap:wrap;gap:8px}.pagehead{display:flex;align-items:center;gap:10px;margin:6px 0 16px}.pagehead h1{font-size:22px;margin:0}.crumb{font-size:12px;color:var(--muted);margin-top:3px}.card{background:linear-gradient(155deg,rgba(14,42,72,.97),rgba(6,25,47,.97));border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 10px 25px #0002}.hero{border-color:#8e6d36;background:radial-gradient(circle at 90% 15%,#4b3a23 0,transparent 35%),linear-gradient(130deg,#102d4e,#06172c);padding:19px}.hero h2{margin:0 0 6px;color:var(--gold);font-size:21px}.muted{color:var(--muted)}.tiny{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:13px;border-radius:14px;border:1px solid var(--line);background:#0a2441;min-width:0}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:20px;font-weight:800;margin-top:5px;overflow-wrap:anywhere}.goldtext{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.action{background:#0b2542;border:1px solid #315578;border-radius:13px;padding:12px 5px;text-align:center;color:var(--text);min-height:72px}.action span{display:block;font-size:21px;color:var(--gold);margin-bottom:4px}.action b{font-size:12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#b6c9df;margin-bottom:6px}.field input,.field select,.field textarea,.search{width:100%;background:#061a31;color:var(--text);border:1px solid #2b5277;border-radius:10px;padding:11px 12px;outline:none;min-width:0}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--gold)}.field textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{flex:1;min-width:130px}.listitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #183956}.listitem:last-child{border-bottom:0}.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:#193d5e;border:1px solid #a77d3d;color:var(--gold);font-weight:800}.grow{flex:1;min-width:0}.grow b{display:block;overflow-wrap:anywhere}.grow small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;background:#163b56;color:#c8def5}.badge.paid{background:#104c3d;color:#71f1bb}.badge.pending{background:#572638;color:#ff9bad}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px;font-size:13px}th,td{padding:10px;border-bottom:1px solid #1b3b5b;text-align:left;vertical-align:top}th{background:#102e4e;color:var(--gold);font-weight:700}tr:last-child td{border-bottom:0}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#041326f2;border-top:1px solid #294967;display:flex;justify-content:center;padding:7px max(6px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.navinner{display:flex;max-width:700px;width:100%;justify-content:space-around;gap:4px}.navbtn{border:0;background:transparent;color:#9db1c9;padding:7px 10px;min-width:55px;font-size:11px}.navbtn span{display:block;font-size:18px;margin-bottom:2px}.navbtn.active{color:var(--gold);background:#142e49}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;background:#123d36;border:1px solid #1d9a71;border-radius:12px;padding:12px 16px;max-width:90%;box-shadow:0 8px 24px #0007}.toast.error{background:#4a2030;border-color:#b84860}.modalback{position:fixed;inset:0;background:#0009;z-index:50;display:grid;place-items:center;padding:18px}.modal{background:#0a2039;border:1px solid var(--gold2);border-radius:17px;padding:20px;width:min(440px,100%)}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(420px,100%);background:#071a30;border:1px solid #805f2e;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0008}.loginbrand{text-align:center;margin-bottom:22px}.lotus{font-size:42px;color:var(--gold)}.loginbrand h1{color:var(--gold);font-family:Georgia,serif;letter-spacing:1px;margin:5px 0}.loginbrand p{color:var(--muted);font-size:12px}.empty{text-align:center;padding:25px;color:var(--muted)}.sectiontitle{font-weight:800;margin:18px 0 10px}.note{background:#122c47;border:1px solid #335675;border-radius:11px;padding:11px;font-size:12px;color:#bcd0e5;margin-bottom:12px}.checkline{display:flex;align-items:center;gap:8px}.checkline input{width:auto}.hiddenfile{display:none}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.actions{grid-template-columns:repeat(6,minmax(0,1fr))}.app{padding-top:22px}.mobileonly{display:none!important}}@media(max-width:420px){.app{padding-left:10px;padding-right:10px}.card{padding:12px}.grid{gap:7px}.stat{padding:10px}.stat .value{font-size:17px}.actions{gap:6px}.action{padding:10px 3px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagehead h1{font-size:20px}}
@media print{body{background:white;color:#111}.app{max-width:none;padding:0}.topbar,.bottomnav,.noprint,.btn,.iconbtn{display:none!important}.card,.stat{background:white;color:#111;border:1px solid #bbb;box-shadow:none;break-inside:avoid}.muted,.stat .label,.grow small{color:#444}th{background:#eee;color:#111}table{min-width:0}.tablewrap{overflow:visible;border-color:#aaa}th,td{border-color:#ccc}.hero h2,.goldtext{color:#111}.pagehead{margin-top:0}}
</style></head>
<body><div id="root"></div><div id="toast" class="toast hidden" role="status"></div><div id="modalroot"></div>
<script>
(()=>{'use strict';
const KEY='khodal24c_app_v1';const names=[
'Gohil Mehulkumar Rajubhai','Gohil Sanjaykumar Juvansinh','Gohil Sunilkumar chandrkant','Gohil Devendrakumar chaturbhai (DC)','Gohil ShaileshKumar Bharatbhai','Gohil Jigneskumar Pravinbhai','Gohil Maheshbhai Chaturbhai (Bhalji)','Gohil Anilbhai Ambalal','Gohil Nilkumar Chandrkant','Gohil VijayKumar Babubhai','Gohil NarendraKumar Babubhai (Bhuro)','Gohil NiteshKumar Pravinbhai (Bhado)','Gohil Dipakkumar Ravjibhai','Gohil Dharmendra Mohanbhai (Dhamo)','Gohil Dharmendra Punambhai (Dhimo)','Gohil MahendraKumar Jayntibhai (kabo)','Gohil Hasmukhkumar Dilipbhai (HD)','Gohil Hasmukhkumar Saburbhai (BR)','Gohil Dipakkumar Javanbhai','Parmar Rajubhai Jasvantbhai (Raju)'];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const now=()=>new Date();const iso=d=>{let x=new Date(d);return isNaN(x)?'':x.toISOString().slice(0,10)};const monthNow=()=>now().toISOString().slice(0,7);const monthLabel=m=>{if(!m)return '';let [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})};const dateTime=()=>({date:iso(now()),time:now().toTimeString().slice(0,5)});
let db=load(),user=null,page='login',prevPage='dashboard',selectedMember=null,editExpense=null,editMember=null,justSavedFund=null,filters={month:monthNow(),search:'',member:'',from:'',to:'',method:'',status:'',expenseSearch:'',memberStatus:'all',sort:'name'};
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.members))return d}catch(e){}return {setup:false,users:[],members:names.map((name,i)=>({id:'m'+(i+1),name,phone:'',whatsapp:'',role:'Member',active:true,joined:iso(now()),created:Date.now()})),funds:[],expenses:[],nextId:21,profile:{}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('ડેટા સાચવી શકાયો નહીં. ફોનમાં storage ખાલી કરો અથવા export લો.',true);return false}}
function toast(msg,error=false){let t=$('#toast');t.textContent=msg;t.classList.toggle('error',error);t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3200)}
function id(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}function me(){return user?db.users.find(x=>x.id===user.id):null}function role(){return me()?.role||'Member'}function isAdmin(){return ['Super Admin','Admin'].includes(role())}function canSuper(){return role()==='Super Admin'}function ownMember(){return db.members.find(m=>m.id===me()?.memberId)}function canSeeMember(m){return isAdmin()||m?.id===me()?.memberId}function visibleMembers(){return isAdmin()?db.members:db.members.filter(m=>m.id===me()?.memberId)}function visibleFunds(){return isAdmin()?db.funds:db.funds.filter(f=>f.memberId===me()?.memberId)}function visibleExpenses(){return isAdmin()?db.expenses:[]}
function totals(){let paid=db.funds.filter(f=>f.status==='Paid').reduce((s,f)=>s+Number(f.amount||0),0),expenses=db.expenses.reduce((s,e)=>s+Number(e.amount||0),0),cur=db.funds.filter(f=>f.status==='Paid'&&f.month===monthNow()).reduce((s,f)=>s+Number(f.amount||0),0),curExp=db.expenses.filter(e=>e.date?.slice(0,7)===monthNow()).reduce((s,e)=>s+Number(e.amount||0),0);return {members:db.members.length,active:db.members.filter(m=>m.active).length,paid,expenses,balance:paid-expenses,cur,curExp}}
function pending(month){return db.members.filter(m=>m.active&&!db.funds.some(f=>f.memberId===m.id&&f.month===month&&f.status==='Paid'))}
function go(p,opts={}){if(!user&&p!=='login'&&p!=='setup'&&p!=='reset'){page=db.setup?'login':'setup';render();return}if(!isAdmin()&&!['dashboard','profile','settings','history','memberProfile'].includes(p)){toast('તમારા Role માટે આ પેજ મંજૂર નથી.',true);return}if(!isAdmin()&&p==='memberProfile'&&opts.memberId!==me()?.memberId){toast('આ Profile જોવાની પરવાનગી નથી.',true);return}prevPage=page;if(opts.memberId!==undefined)selectedMember=opts.memberId;if(opts.expenseId!==undefined)editExpense=opts.expenseId;page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function header(title,crumb='Dashboard'){return `<div class="pagehead"><button class="iconbtn noprint" onclick="historyBack()">←</button><div><h1>${esc(title)}</h1><div class="crumb">${esc(crumb)}</div></div><div style="margin-left:auto"><button class="iconbtn noprint" onclick="go('dashboard')">⌂</button></div></div>`}
function nav(){if(!user)return '';let items=[['dashboard','⌂','Home'],['members','♙','Members'],['fund','₹','Fund'],['pending','◷','Pending'],['more','⋯','More']];return `<nav class="bottomnav"><div class="navinner">${items.map(([p,ic,l])=>`<button class="navbtn ${page===p?'active':''}" onclick="${p==='more'?'openMore()':`go('${p}')`}"><span>${ic}</span>${l}</button>`).join('')}</div></nav>`}
function render(){let root=$('#root');if(!user){root.innerHTML=page==='setup'?setupPage():page==='reset'?resetPage():loginPage();return}let html=`<div class="app"><div class="topbar"><div class="brand"><div class="logo">✿</div><div>Khodal 24C Team<small>${esc(role())} · Together for Better Tomorrow</small></div></div><button class="iconbtn noprint" onclick="go('settings')">⚙</button></div>`;const pages={dashboard:dashboardPage,members:membersPage,memberProfile:memberProfilePage,memberForm:memberFormPage,fund:fundPage,pending:pendingPage,history:historyPage,expenses:expensesPage,expenseForm:expenseFormPage,reports:reportsPage,profile:profilePage,settings:settingsPage,more:morePage};html+=(pages[page]||dashboardPage)()+`</div>`+nav();root.innerHTML=html}
function setupPage(){return `<div class="loginwrap"><div class="loginbox"><div class="loginbrand"><div class="lotus">❋</div><h1>KHODAL 24C</h1><h2 style="color:var(--gold);font: bold 19px Georgia;margin:0">TEAM</h2><p>Together for Better Tomorrow</p></div><h2>પ્રથમ Super Admin બનાવો</h2><div class="note">આ એપનો પ્રથમ Login છે. તમારું નામ, Email અને Password સેટ કરો. આ standalone ફાઇલનો ડેટા આ જ બ્રાઉઝરમાં રહેશે.</div><form onsubmit="createAdmin(event)"><div class="field"><label>તમારું નામ</label><input name="name" required maxlength="80" autocomplete="name"></div><div class="field"><label>Email Address</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password (ઓછામાં ઓછા 8 અક્ષર)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>ફરી Password</label><input name="confirm" type="password" minlength="8" required></div><button class="btn gold" style="width:100%">Create Super Admin</button></form></div></div>`}
function loginPage(){return `<div class="loginwrap"><div class="loginbox"><div class="loginbrand"><div class="lotus">❋</div><h1>KHODAL 24C</h1><h2 style="color:var(--gold);font: bold 19px Georgia;margin:0">TEAM</h2><p>Together for Better Tomorrow</p></div><form onsubmit="login(event)"><div class="field"><label>Email Address</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><div style="display:flex;gap:6px"><input id="loginpass" name="password" type="password" required autocomplete="current-password"><button type="button" class="iconbtn" onclick="togglePass()">◉</button></div></div><div id="loginerr" class="red tiny" style="margin-bottom:10px"></div><button class="btn gold" style="width:100%">Login</button></form><p class="tiny muted" style="text-align:center;margin-top:16px"><button class="navbtn" onclick="go('reset')">Forgot Password?</button></p><p class="tiny muted" style="text-align:center">Khodal 24C Team</p></div></div>`}
function resetPage(){return `<div class="loginwrap"><div class="loginbox"><h2 class="goldtext">Reset Password</h2><div class="note">આ standalone app માં Admin password reset માટે વર્તમાન account નો email અને નવી password જરૂરી છે. ભૂલશો નહીં કે આ multi-device online authentication નથી.</div><form onsubmit="resetPassword(event)"><div class="field"><label>Account Email</label><input name="email" type="email" required></div><div class="field"><label>New Password</label><input name="password" type="password" minlength="8" required></div><button class="btn gold" style="width:100%">Update Password</button></form><button class="btn" style="width:100%;margin-top:10px" onclick="page='login';render()">Back to Login</button></div></div>`}
function dashboardPage(){let t=totals(),p=pending(monthNow()).length;return `${header('Dashboard','Home')}<div class="card hero"><h2>✿ Together We Grow</h2><div>Our Team Our Strength</div><div class="tiny muted" style="margin-top:10px">સ્વાગત છે, ${esc(me()?.name||'Team Member')}</div></div><div class="grid"><div class="stat"><div class="label">Total Members</div><div class="value">${t.members}</div><div class="tiny muted">Active: ${t.active}</div></div><div class="stat"><div class="label">Total Fund Received</div><div class="value goldtext">${money(t.paid)}</div></div><div class="stat"><div class="label">Current Month Fund</div><div class="value">${money(t.cur)}</div></div><div class="stat"><div class="label">Pending Fund Members</div><div class="value red">${p}</div></div><div class="stat"><div class="label">Total Expenses</div><div class="value">${money(t.expenses)}</div></div><div class="stat"><div class="label">Available Balance</div><div class="value ${t.balance<0?'red':'green'}">${money(t.balance)}</div></div></div><div class="sectiontitle">Quick Actions</div><div class="actions">${isAdmin()?`<button class="action" onclick="go('fund')"><span>₹</span><b>Add Fund</b></button><button class="action" onclick="go('members')"><span>♙</span><b>Members</b></button><button class="action" onclick="go('pending')"><span>◷</span><b>Pending Fund</b></button><button class="action" onclick="go('history')"><span>▤</span><b>Fund History</b></button><button class="action" onclick="go('expenses')"><span>▣</span><b>Expenses</b></button><button class="action" onclick="go('reports')"><span>▥</span><b>Reports</b></button>`:`<button class="action" onclick="go('profile')"><span>♙</span><b>My Profile</b></button><button class="action" onclick="go('history')"><span>₹</span><b>My Fund History</b></button>`}</div><div class="sectiontitle">Recent Fund Entries</div><div class="card">${fundRows(visibleFunds().slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5))}</div>`}
function memberCard(m){let paid=db.funds.filter(f=>f.memberId===m.id&&f.status==='Paid').reduce((s,f)=>s+Number(f.amount),0);return `<div class="listitem"><div class="avatar">${esc((m.name||'?').trim().charAt(0))}</div><div class="grow"><b>${esc(m.name)}</b><small>${esc(m.phone||'Phone not added')} · ${money(paid)} paid</small><small>${esc(m.role||'Member')} · ${m.active?'<span class="green">Active</span>':'<span class="red">Inactive</span>'}</small></div><button class="btn small" onclick="go('memberProfile',{memberId:'${m.id}'})">View</button></div>`}
function membersPage(){let list=visibleMembers(),q=filters.search.toLowerCase();list=list.filter(m=>(m.name+' '+m.phone+' '+m.whatsapp).toLowerCase().includes(q)&&(filters.memberStatus==='all'||(filters.memberStatus==='active'?m.active:!m.active)));list.sort((a,b)=>filters.sort==='name'?a.name.localeCompare(b.name):filters.sort==='paid'?paidTotal(b.id)-paidTotal(a.id):new Date(b.joined)-new Date(a.joined));return `${header('Members','Dashboard → Members')}<div class="card"><div class="toolbar"><input class="search" placeholder="Search member..." value="${esc(filters.search)}" oninput="filters.search=this.value;renderKeepFocus(this)"><select class="search" onchange="filters.memberStatus=this.value;render()"><option value="all" ${filters.memberStatus==='all'?'selected':''}>All Status</option><option value="active" ${filters.memberStatus==='active'?'selected':''}>Active</option><option value="inactive" ${filters.memberStatus==='inactive'?'selected':''}>Inactive</option></select><select class="search" onchange="filters.sort=this.value;render()"><option value="name">Sort: Name</option><option value="paid" ${filters.sort==='paid'?'selected':''}>Sort: Fund Paid</option><option value="joined" ${filters.sort==='joined'?'selected':''}>Sort: Joining Date</option></select></div>${isAdmin()?'<button class="btn gold" onclick="go(\'memberForm\')">＋ Add Member</button>':''}<div class="tiny muted" style="margin-top:10px">${list.length} members</div>${list.length?list.map(memberCard).join(''):'<div class="empty">કોઈ સભ્ય મળ્યો નથી.</div>'}</div>`}
function paidTotal(mid){return db.funds.filter(f=>f.memberId===mid&&f.status==='Paid').reduce((s,f)=>s+Number(f.amount),0)}
function memberProfilePage(){let m=db.members.find(x=>x.id===selectedMember)||ownMember();if(!m||!canSeeMember(m))return `${header('Member Profile')}<div class="card empty">Profile ઉપલબ્ધ નથી.</div>`;let fs=(isAdmin()?db.funds:visibleFunds()).filter(f=>f.memberId===m.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));let by={};fs.filter(f=>f.status==='Paid').forEach(f=>by[f.month]=(by[f.month]||0)+Number(f.amount));return `${header('Member Profile','Dashboard → Members → Profile')}<div class="card"><div class="listitem"><div class="avatar" style="width:54px;height:54px">${esc(m.name[0])}</div><div class="grow"><b style="font-size:18px">${esc(m.name)}</b><small>${esc(m.role||'Member')} · ${m.active?'Active':'Inactive'}</small></div></div><div class="grid" style="margin-top:10px"><div class="stat"><div class="label">Phone</div><div class="value" style="font-size:14px">${esc(m.phone||'Not added')}</div></div><div class="stat"><div class="label">WhatsApp</div><div class="value" style="font-size:14px">${esc(m.whatsapp||'Not added')}</div></div><div class="stat"><div class="label">Joining Date</div><div class="value" style="font-size:14px">${esc(m.joined||'Not added')}</div></div><div class="stat"><div class="label">Total Fund Paid</div><div class="value goldtext">${money(paidTotal(m.id))}</div></div></div><div class="btnrow" style="margin-top:12px">${m.phone?`<a class="btn small" href="tel:${esc(m.phone)}">☎ Call</a>`:''}${waLink(m)?`<button class="btn small success" onclick="openWA('${m.id}')">WhatsApp</button>`:''}${isAdmin()?`<button class="btn small" onclick="editMemberStart('${m.id}')">Edit Member</button><button class="btn small" onclick="go('fund');setFundMember('${m.id}')">＋ Add Fund</button><button class="btn small ${m.active?'danger':'success'}" onclick="toggleMember('${m.id}')">${m.active?'Deactivate':'Activate'}</button>`:''}<button class="btn small" onclick="print()">Print / PDF</button></div></div><div class="sectiontitle">Month-wise Fund Summary</div><div class="card">${Object.keys(by).length?Object.keys(by).sort().reverse().map(mon=>`<div class="listitem"><div class="grow"><b>${esc(monthLabel(mon))}</b></div><b class="goldtext">${money(by[mon])}</b></div>`).join(''):'<div class="empty">હજુ Paid Fund Entry નથી.</div>'}</div><div class="sectiontitle">Individual Fund History</div><div class="card"><div class="toolbar"><input class="search" placeholder="Search notes / method" oninput="filters.search=this.value;render()"><select class="search" onchange="filters.month=this.value;render()"><option value="">All Months</option>${monthOptions(fs.map(f=>f.month),filters.month)}</select></div>${fundRows(fs.filter(f=>(!filters.month||f.month===filters.month)&&((f.note||'').toLowerCase().includes((filters.search||'').toLowerCase())||(f.method||'').toLowerCase().includes((filters.search||'').toLowerCase()))))}<div class="btnrow"><button class="btn" onclick="exportCSV('memberfunds')">Export CSV</button><button class="btn" onclick="shareMemberReport('${m.id}')">Share Report</button></div></div>`}
function memberFormPage(){if(!isAdmin())return '';let m=editMember?db.members.find(x=>x.id===editMember):null;return `${header(m?'Edit Member':'Add New Member','Dashboard → Members → Form')}<div class="card"><form onsubmit="saveMember(event)"><div class="field"><label>Full Name *</label><input name="name" required maxlength="100" value="${esc(m?.name||'')}"></div><div class="formgrid"><div class="field"><label>Phone Number</label><input name="phone" inputmode="tel" value="${esc(m?.phone||'')}"></div><div class="field"><label>WhatsApp Number</label><input name="whatsapp" inputmode="tel" value="${esc(m?.whatsapp||'')}"></div><div class="field"><label>Role</label><select name="role"><option ${(!m||m.role==='Member')?'selected':''}>Member</option><option ${m?.role==='Admin'?'selected':''}>Admin</option></select></div><div class="field"><label>Joining Date</label><input name="joined" type="date" value="${esc(m?.joined||iso(now()))}"></div></div><label class="checkline"><input name="active" type="checkbox" ${m?.active!==false?'checked':''}> Active Member</label><div class="btnrow" style="margin-top:16px"><button class="btn gold">Save Member</button><button type="button" class="btn" onclick="editMember=null;go('members')">Cancel</button></div></form></div>`}
function monthOptions(list=[],selected=''){let set=new Set([...list.filter(Boolean),monthNow()]);return [...set].sort().reverse().map(m=>`<option value="${esc(m)}" ${m===selected?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}
function fundPage(){if(!isAdmin())return '';let dt=dateTime();return `${header('Add Fund Entry','Dashboard → Fund')}<div class="card"><div class="note">દરેક Fund Entry અલગથી સાચવાશે. કોઈ Fixed Monthly Fund Amount નથી. એક જ મહિનામાં ઘણી Entries કરી શકાય છે.</div><form id="fundform" onsubmit="saveFund(event)"><div class="field"><label>Select Member *</label><select name="memberId" id="fundmember" required><option value="">Select Member</option>${db.members.filter(m=>m.active).sort((a,b)=>a.name.localeCompare(b.name)).map(m=>`<option value="${m.id}" ${m.id===selectedMember?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Amount (₹) *</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="Enter amount"></div><div class="field"><label>Fund Month *</label><input name="month" type="month" required value="${monthNow()}"></div><div class="field"><label>Payment Date *</label><input name="date" type="date" required value="${dt.date}"></div><div class="field"><label>Payment Time *</label><input name="time" type="time" required value="${dt.time}"></div><div class="field"><label>Payment Method</label><select name="method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Other</option></select></div><div class="field"><label>Payment Status</label><select name="status"><option>Paid</option><option>Pending</option></select></div><div class="field full"><label>Note (Optional)</label><textarea name="note" maxlength="500" placeholder="Payment note"></textarea></div></div><div class="btnrow"><button class="btn gold" id="savefundbtn">Save Fund</button><button class="btn" type="reset">Clear Form</button></div></form></div>${justSavedFund?`<div class="card"><b class="green">✓ Fund entry saved</b><div class="btnrow" style="margin-top:10px"><button class="btn" onclick="go('history')">View Fund History</button><button class="btn" onclick="justSavedFund=null;go('fund')">Add Another Fund</button><button class="btn" onclick="go('dashboard')">Dashboard</button><button class="btn" onclick="go('memberProfile',{memberId:'${justSavedFund.memberId}'})">Member Profile</button></div></div>`:''}`}
function setFundMember(mid){selectedMember=mid;render()}function saveFund(e){e.preventDefault();let f=new FormData(e.target),mid=f.get('memberId'),amount=Number(f.get('amount'));if(!db.members.some(m=>m.id===mid&&m.active)){toast('Active member પસંદ કરો.',true);return}if(!Number.isFinite(amount)||amount<=0){toast('યોગ્ય Amount દાખલ કરો.',true);return}let record={id:id('f'),memberId:mid,amount,month:f.get('month'),date:f.get('date'),time:f.get('time'),method:f.get('method'),status:f.get('status'),note:f.get('note').trim(),created:Date.now()};if(!record.month||!record.date||!record.time){toast('બધી જરૂરી વિગતો ભરો.',true);return}if(db.funds.some(x=>x.id===record.id))return;let b=$('#savefundbtn');b.disabled=true;db.funds.push(record);if(persist()){justSavedFund=record;toast('Fund Entry સાચવાઈ ગઈ.');render()}else{db.funds=db.funds.filter(x=>x.id!==record.id);b.disabled=false}}
function pendingPage(){if(!isAdmin())return '';let list=pending(filters.month).filter(m=>(m.name+' '+m.phone+' '+m.whatsapp).toLowerCase().includes((filters.search||'').toLowerCase()));return `${header('Pending Fund','Dashboard → Pending Fund')}<div class="card"><div class="toolbar"><div class="field" style="margin:0;flex:2"><label>Select Month</label><input class="search" type="month" value="${esc(filters.month)}" onchange="filters.month=this.value;render()"></div><div class="field" style="margin:0;flex:2"><label>Search Pending Members</label><input class="search" value="${esc(filters.search)}" oninput="filters.search=this.value;renderKeepFocus(this)" placeholder="Member name"></div></div><div class="grid"><div class="stat"><div class="label">Pending Members · ${esc(monthLabel(filters.month))}</div><div class="value red">${list.length}</div></div><div class="stat"><div class="label">Rule</div><div class="tiny">તે મહિનામાં એકપણ Paid Entry ન હોય તો જ Pending.</div></div></div><div class="btnrow noprint" style="margin:12px 0"><button class="btn" onclick="print()">Print Pending List</button><button class="btn" onclick="exportCSV('pending')">Export CSV</button><button class="btn" onclick="go('history')">Fund History</button></div>${list.length?list.map(m=>`<div class="listitem"><div class="avatar">${esc(m.name[0])}</div><div class="grow"><b>${esc(m.name)}</b><small>${esc(m.phone||'Phone not added')} · ${esc(monthLabel(filters.month))}</small></div><div class="btnrow">${waLink(m)?`<button class="btn small success" onclick="openWA('${m.id}','${filters.month}')">WhatsApp</button>`:''}<button class="btn small" onclick="go('memberProfile',{memberId:'${m.id}'})">Profile</button></div></div>`).join(''):'<div class="empty">આ મહિના માટે Pending Member નથી. અથવા search બદલશો.</div>'}</div>`}
function fundRows(fs){if(!fs.length)return '<div class="empty">કોઈ Fund Entry નથી.</div>';return `<div class="tablewrap"><table><thead><tr><th>Member</th><th>Month</th><th>Amount</th><th>Date / Time</th><th>Method</th><th>Status</th><th>Note</th></tr></thead><tbody>${fs.map(f=>{let m=db.members.find(x=>x.id===f.memberId);return `<tr><td>${esc(m?.name||'Unknown member')}</td><td>${esc(monthLabel(f.month))}</td><td><b>${money(f.amount)}</b></td><td>${esc(f.date||'—')}<br>${esc(f.time||'—')}</td><td>${esc(f.method||'—')}</td><td><span class="badge ${f.status==='Paid'?'paid':'pending'}">${esc(f.status)}</span></td><td>${esc(f.note||'—')}</td></tr>`}).join('')}</tbody></table></div><div class="tiny muted" style="margin-top:9px">Filtered Total (Paid): <b>${money(fs.filter(f=>f.status==='Paid').reduce((s,f)=>s+Number(f.amount),0))}</b> · Entries: ${fs.length}</div>`}
function historyPage(){let fs=visibleFunds().slice(),q=(filters.search||'').toLowerCase();fs=fs.filter(f=>{let m=db.members.find(x=>x.id===f.memberId);return (!q||((m?.name||'')+' '+(f.note||'')+' '+f.method).toLowerCase().includes(q))&&(!filters.month||f.month===filters.month)&&(!filters.member||f.memberId===filters.member)&&(!filters.from||f.date>=filters.from)&&(!filters.to||f.date<=filters.to)&&(!filters.method||f.method===filters.method)&&(!filters.status||f.status===filters.status)}).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.time||'').localeCompare(a.time||''));return `${header(isAdmin()?'Fund History':'My Fund History','Dashboard → Fund History')}<div class="card"><div class="toolbar"><input class="search" placeholder="Search member / note" value="${esc(filters.search)}" oninput="filters.search=this.value;renderKeepFocus(this)"><select class="search" onchange="filters.month=this.value"><option value="">All Months</option>${monthOptions(fs.map(f=>f.month),filters.month)}</select><select class="search" onchange="filters.member=this.value"><option value="">All Members</option>${visibleMembers().map(m=>`<option value="${m.id}" ${filters.member===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input class="search" type="date" aria-label="From date" value="${esc(filters.from)}" onchange="filters.from=this.value"><input class="search" type="date" aria-label="To date" value="${esc(filters.to)}" onchange="filters.to=this.value"><select class="search" onchange="filters.method=this.value"><option value="">All Methods</option>${['Cash','UPI','Bank Transfer','Other'].map(x=>`<option ${filters.method===x?'selected':''}>${x}</option>`).join('')}</select><select class="search" onchange="filters.status=this.value"><option value="">All Status</option><option ${filters.status==='Paid'?'selected':''}>Paid</option><option ${filters.status==='Pending'?'selected':''}>Pending</option></select><button class="btn" onclick="render()">Apply Filters</button></div><div class="btnrow noprint" style="margin-bottom:12px"><button class="btn" onclick="print()">Print / PDF</button><button class="btn" onclick="exportCSV('funds')">Export CSV</button></div>${fundRows(fs)}</div>`}
function expensesPage(){if(!isAdmin())return '';let es=db.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)),q=(filters.expenseSearch||'').toLowerCase();es=es.filter(e=>(e.title+' '+e.paidTo+' '+e.description).toLowerCase().includes(q)&&(!filters.from||e.date>=filters.from)&&(!filters.to||e.date<=filters.to));return `${header('Expenses','Dashboard → Expenses')}<div class="card"><div class="toolbar"><input class="search" placeholder="Search expenses" value="${esc(filters.expenseSearch)}" oninput="filters.expenseSearch=this.value;renderKeepFocus(this)"><input class="search" type="date" value="${esc(filters.from)}" onchange="filters.from=this.value;render()"><input class="search" type="date" value="${esc(filters.to)}" onchange="filters.to=this.value;render()"></div><div class="grid"><div class="stat"><div class="label">Total Expenses</div><div class="value red">${money(totals().expenses)}</div></div><div class="stat"><div class="label">Filtered Total</div><div class="value">${money(es.reduce((s,e)=>s+Number(e.amount),0))}</div></div></div><div class="btnrow noprint" style="margin:12px 0"><button class="btn gold" onclick="editExpense=null;go('expenseForm')">＋ Add Expense</button><button class="btn" onclick="print()">Print Report</button><button class="btn" onclick="exportCSV('expenses')">Export CSV</button></div>${es.length?es.map(e=>`<div class="listitem"><div class="avatar">₹</div><div class="grow"><b>${esc(e.title)} · ${money(e.amount)}</b><small>${esc(e.date)} · Paid to: ${esc(e.paidTo||'—')}</small><small>${esc(e.description||'')}</small></div><div class="btnrow"><button class="btn small" onclick="editExpenseStart('${e.id}')">Edit</button><button class="btn small danger" onclick="deleteExpense('${e.id}')">Delete</button></div></div>`).join(''):'<div class="empty">હજુ કોઈ Expense નોંધાયેલ નથી.</div>'}</div>`}
function expenseFormPage(){if(!isAdmin())return '';let e=editExpense?db.expenses.find(x=>x.id===editExpense):null;return `${header(e?'Edit Expense':'Add Expense','Dashboard → Expenses → Form')}<div class="card"><form onsubmit="saveExpense(event)"><div class="field"><label>Expense Title *</label><input name="title" required maxlength="100" value="${esc(e?.title||'')}"></div><div class="formgrid"><div class="field"><label>Amount (₹) *</label><input name="amount" type="number" min="0.01" step="0.01" required value="${esc(e?.amount??'')}"></div><div class="field"><label>Expense Date *</label><input name="date" type="date" required value="${esc(e?.date||iso(now()))}"></div><div class="field full"><label>Paid To</label><input name="paidTo" maxlength="100" value="${esc(e?.paidTo||'')}"></div><div class="field full"><label>Description</label><textarea name="description" maxlength="500">${esc(e?.description||'')}</textarea></div></div><div class="btnrow"><button class="btn gold">Save Expense</button><button type="button" class="btn" onclick="editExpense=null;go('expenses')">Cancel</button></div></form></div>`}
function reportsPage(){if(!isAdmin())return '';let mon=filters.month||monthNow(),fs=db.funds.filter(f=>f.month===mon),es=db.expenses.filter(e=>e.date.slice(0,7)===mon),t=totals(),ps=pending(mon);let ms=db.members.filter(m=>m.active).map(m=>{let a=fs.filter(f=>f.memberId===m.id&&f.status==='Paid'),sum=a.reduce((s,f)=>s+Number(f.amount),0);return {m,sum,count:a.length,last:a.map(x=>x.date).sort().reverse()[0]||'—',status:a.length?'Paid':'Unpaid'}});return `${header('Reports','Dashboard → Reports')}<div class="card"><div class="field"><label>Select Month</label><input class="search" type="month" value="${esc(mon)}" onchange="filters.month=this.value;render()"></div><div class="grid"><div class="stat"><div class="label">Total Members</div><div class="value">${t.members}</div></div><div class="stat"><div class="label">Total Fund Received</div><div class="value goldtext">${money(t.paid)}</div></div><div class="stat"><div class="label">Total Expenses</div><div class="value">${money(t.expenses)}</div></div><div class="stat"><div class="label">Available Balance</div><div class="value ${t.balance<0?'red':'green'}">${money(t.balance)}</div></div><div class="stat"><div class="label">${esc(monthLabel(mon))} Fund</div><div class="value">${money(fs.filter(f=>f.status==='Paid').reduce((s,f)=>s+Number(f.amount),0))}</div></div><div class="stat"><div class="label">${esc(monthLabel(mon))} Expenses</div><div class="value">${money(es.reduce((s,e)=>s+Number(e.amount),0))}</div></div><div class="stat"><div class="label">Pending Members</div><div class="value red">${ps.length}</div></div></div><div class="btnrow noprint" style="margin-top:12px"><button class="btn" onclick="print()">Print / Save PDF</button><button class="btn" onclick="exportCSV('report')">Export CSV</button><button class="btn" onclick="shareText('Khodal 24C Team Report - '+monthLabel(mon)+'\nFund: '+money(fs.filter(f=>f.status==='Paid').reduce((s,f)=>s+Number(f.amount),0))+'\nExpenses: '+money(es.reduce((s,e)=>s+Number(e.amount),0))+'\nPending Members: '+ps.length+'\nBalance: '+money(t.balance))">Share Report</button></div></div><div class="sectiontitle">Month-wise Member Report</div><div class="card">${ms.length?`<div class="tablewrap"><table><thead><tr><th>Member</th><th>Month</th><th>Total Paid</th><th>Entries</th><th>Last Payment</th><th>Status</th></tr></thead><tbody>${ms.map(x=>`<tr><td>${esc(x.m.name)}</td><td>${esc(monthLabel(mon))}</td><td>${money(x.sum)}</td><td>${x.count}</td><td>${esc(x.last)}</td><td><span class="badge ${x.status==='Paid'?'paid':'pending'}">${x.status}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No members</div>'}</div><div class="sectiontitle">Expense Report</div><div class="card">${es.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Expense</th><th>Amount</th><th>Paid To</th></tr></thead><tbody>${es.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.title)}</td><td>${money(e.amount)}</td><td>${esc(e.paidTo||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">આ મહિને કોઈ Expense નથી.</div>'}</div>`}

function settingsPage(){return `${header('Settings','Dashboard → Settings')}<div class="card"><div class="listitem"><div class="avatar">♙</div><div class="grow"><b>${esc(me()?.name)}</b><small>${esc(me()?.email)} · ${esc(role())}</small></div></div><div class="sectiontitle">Change Password</div><form onsubmit="changePassword(event)"><div class="field"><label>Current Password</label><input name="old" type="password" required></div><div class="field"><label>New Password (8+ characters)</label><input name="next" type="password" minlength="8" required></div><div class="field"><label>Confirm New Password</label><input name="confirm" type="password" minlength="8" required></div><button class="btn gold">Change Password</button></form><div class="sectiontitle">Data & Account</div><div class="note">આ એક જ HTML ફાઇલની local-storage આવૃત્તિ છે. ડેટા આ બ્રાઉઝર/ડિવાઇસમાં જ રહે છે. Browser data clear થાય તો export backup જરૂરી છે.</div><div class="btnrow"><button class="btn" onclick="exportCSV('backup')">Export Backup JSON</button><label class="btn" for="importfile">Import Backup JSON</label><input id="importfile" class="hiddenfile" type="file" accept="application/json" onchange="importBackup(event)"><button class="btn" onclick="refreshData()">↻ Refresh Data</button><button class="btn danger" onclick="logoutConfirm()">Logout</button></div>${canSuper()?`<div class="sectiontitle">User Accounts</div><div class="tiny muted">Accounts: ${db.users.length}. Role changes should be managed only by Super Admin.</div>${db.users.map(u=>`<div class="listitem"><div class="grow"><b>${esc(u.name)}</b><small>${esc(u.email)} · ${esc(u.role)}</small></div>${u.id!==me().id?`<select class="search" style="max-width:130px" onchange="changeUserRole('${u.id}',this.value)"><option ${u.role==='Member'?'selected':''}>Member</option><option ${u.role==='Admin'?'selected':''}>Admin</option><option ${u.role==='Super Admin'?'selected':''}>Super Admin</option></select>`:''}</div>`).join('')}`:''}</div>`}
function morePage(){return `${header('More','Navigation')}<div class="card">${[['history','▤','Fund History'],['expenses','▣','Expenses'],['reports','▥','Reports'],['profile','♙','My Profile'],['settings','⚙','Settings']].filter(([p])=>isAdmin()||['profile','history','settings'].includes(p)).map(([p,ic,l])=>`<button class="listitem" style="width:100%;background:none;color:inherit;text-align:left;border-top:0;border-left:0;border-right:0" onclick="go('${p}')"><div class="avatar">${ic}</div><div class="grow"><b>${l}</b><small>Open ${l}</small></div><span>›</span></button>`).join('')}<button class="btn danger" style="width:100%;margin-top:14px" onclick="logoutConfirm()">Logout</button></div>`}
function historyBack(){if(page==='memberProfile')go('members');else if(page==='memberForm')go('members');else if(page==='expenseForm')go('expenses');else go('dashboard')}
function openMore(){go('more')};function togglePass(){let x=$('#loginpass');if(x)x.type=x.type==='password'?'text':'password'}
function createAdmin(e){e.preventDefault();let f=new FormData(e.target),p=f.get('password');if(p!==f.get('confirm'))return toast('Password સરખા નથી.',true);let email=f.get('email').trim().toLowerCase();if(db.users.some(u=>u.email===email))return toast('આ Email પહેલેથી છે.',true);let u={id:id('u'),name:f.get('name').trim(),email,password:p,role:'Super Admin',memberId:null};db.users.push(u);db.setup=true;persist();user={id:u.id};page='dashboard';render();toast('Super Admin Account બનાવ્યું.')}
function login(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),u=db.users.find(x=>x.email===email&&x.password===f.get('password'));if(!u){$('#loginerr').textContent='Email અથવા Password ખોટો છે.';return}user={id:u.id};page='dashboard';persist();render();toast('Login સફળ થયું.')}
function resetPassword(e){e.preventDefault();let f=new FormData(e.target),u=db.users.find(x=>x.email===f.get('email').trim().toLowerCase());if(!u)return toast('આ Email account મળ્યું નથી.',true);u.password=f.get('password');persist();page='login';render();toast('Password update થયો. હવે Login કરો.')}
function logoutConfirm(){modal('Logout કરવું છે?',`શું તમે Khodal 24C Team માંથી Logout કરવા માંગો છો?`,()=>{user=null;page='login';selectedMember=null;render();toast('Logout થઈ ગયું.')})}
function modal(title,msg,yes){$('#modalroot').innerHTML=`<div class="modalback"><div class="modal"><h3>${esc(title)}</h3><p class="muted">${esc(msg)}</p><div class="btnrow"><button class="btn danger" id="modalyes">Confirm</button><button class="btn" onclick="closeModal()">Cancel</button></div></div></div>`;$('#modalyes').onclick=()=>{closeModal();yes()}}
function closeModal(){$('#modalroot').innerHTML=''}
function saveMember(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return toast('નામ જરૂરી છે.',true);let phone=f.get('phone').trim(),wa=f.get('whatsapp').trim();if(phone&&!/^[+\d\s()-]{7,18}$/.test(phone))return toast('Phone Number તપાસો.',true);if(wa&&!/^[+\d\s()-]{7,18}$/.test(wa))return toast('WhatsApp Number તપાસો.',true);if(editMember){let m=db.members.find(x=>x.id===editMember);if(!m)return;Object.assign(m,{name,phone,whatsapp:wa,role:f.get('role'),joined:f.get('joined'),active:f.has('active')})}else{db.members.push({id:id('m'),name,phone,whatsapp:wa,role:f.get('role'),joined:f.get('joined')||iso(now()),active:f.has('active'),created:Date.now()})}persist();editMember=null;go('members');toast('Member સાચવ્યો.')}
function editMemberStart(mid){if(!isAdmin())return;editMember=mid;go('memberForm')}
function toggleMember(mid){let m=db.members.find(x=>x.id===mid);if(!m||!isAdmin())return;modal(m.active?'Deactivate Member?':'Activate Member?',`${m.name} નો Active Status બદલવો છે?`,()=>{m.active=!m.active;persist();render();toast('Member status update થયો.')})}
function saveExpense(e){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0||!Number.isFinite(amount))return toast('Amount યોગ્ય દાખલ કરો.',true);let rec={id:editExpense||id('e'),title:f.get('title').trim(),amount,date:f.get('date'),paidTo:f.get('paidTo').trim(),description:f.get('description').trim()};if(editExpense){let i=db.expenses.findIndex(x=>x.id===editExpense);if(i<0)return toast('Expense મળ્યો નથી.',true);db.expenses[i]=rec}else db.expenses.push(rec);persist();editExpense=null;go('expenses');toast('Expense સાચવ્યો.')}
function editExpenseStart(eid){editExpense=eid;go('expenseForm')}
function deleteExpense(eid){let e=db.expenses.find(x=>x.id===eid);if(!e)return;modal('Delete Expense?',`${e.title} — ${money(e.amount)} કાઢી નાખવો છે?`,()=>{db.expenses=db.expenses.filter(x=>x.id!==eid);persist();render();toast('Expense delete થયો.')})}
function updateProfile(e){e.preventDefault();let f=new FormData(e.target),u=me();u.name=f.get('name').trim();u.email=f.get('email').trim().toLowerCase();u.phone=f.get('phone').trim();let m=ownMember();if(m){m.name=u.name;m.phone=u.phone}persist();render();toast('Profile update થયું.')}
function changePassword(e){e.preventDefault();let f=new FormData(e.target),u=me();if(f.get('old')!==u.password)return toast('Current Password ખોટો છે.',true);if(f.get('next')!==f.get('confirm'))return toast('New Password સરખા નથી.',true);u.password=f.get('next');persist();render();toast('Password બદલાઈ ગયો.')}
function changeUserRole(uid,r){if(!canSuper())return;let u=db.users.find(x=>x.id===uid);if(!u)return;if(u.role==='Super Admin'&&r!=='Super Admin'&&db.users.filter(x=>x.role==='Super Admin').length===1){toast('ઓછામાં ઓછો એક Super Admin જરૂરી છે.',true);render();return}u.role=r;persist();render();toast('User Role update થયો.')}
function refreshData(){db=load();render();toast('Data refresh થયો.')}
function waLink(m){let n=(m.whatsapp||m.phone||'').replace(/\D/g,'');if(n.length===10)n='91'+n;else if(n.length===11&&n.startsWith('0'))n='91'+n.slice(1);return n.length>=11&&n.length<=15?n:''}
function openWA(mid,mon=filters.month){let m=db.members.find(x=>x.id===mid);if(!m)return;let n=waLink(m);if(!n)return toast('આ સભ્યનો યોગ્ય WhatsApp/Phone Number ઉમેરો.',true);let msg=`નમસ્તે ${m.name} ભાઈ 🙏\n\nKhodal 24C Team તરફથી યાદ અપાવવાનું કે ${monthLabel(mon)} મહિનાનું તમારું Fund હજી નોંધાયું નથી.\n\nજો તમે Fund આપી દીધું હોય તો કૃપા કરીને Admin ને જાણ કરશો.\n\nઆભાર 🙏`;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank','noopener')}
function shareText(txt){if(navigator.share)navigator.share({title:'Khodal 24C Team',text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Report clipboard માં copy થયો.')).catch(()=>toast('Share ઉપલબ્ધ નથી.',true));else toast(txt)}
function shareMemberReport(mid){let m=db.members.find(x=>x.id===mid),fs=db.funds.filter(f=>f.memberId===mid);if(!m)return;shareText(`Khodal 24C Team\nMember: ${m.name}\nTotal Paid: ${money(paidTotal(mid))}\nEntries: ${fs.length}\n`+fs.map(f=>`${monthLabel(f.month)} | ${money(f.amount)} | ${f.date} | ${f.status}`).join('\n'))}
function exportCSV(type){let rows=[],filename=type;const add=(headers,data)=>{rows=[headers,...data]};if(type==='funds'||type==='memberfunds'){let fs=type==='memberfunds'?db.funds.filter(f=>f.memberId===selectedMember):visibleFunds();add(['Member Name','Fund Month','Amount','Payment Date','Payment Time','Payment Method','Status','Note'],fs.map(f=>[db.members.find(m=>m.id===f.memberId)?.name||'',f.month,f.amount,f.date,f.time,f.method,f.status,f.note]))}else if(type==='pending'){let mon=filters.month;add(['Member Name','Phone','WhatsApp','Month','Status'],pending(mon).map(m=>[m.name,m.phone,m.whatsapp,mon,'Pending']))}else if(type==='expenses'){add(['Expense Date','Title','Amount','Paid To','Description'],db.expenses.map(e=>[e.date,e.title,e.amount,e.paidTo,e.description]))}else if(type==='report'){let mon=filters.month;add(['Member Name','Month','Total Paid','Entries','Last Payment Date','Status'],db.members.filter(m=>m.active).map(m=>{let a=db.funds.filter(f=>f.memberId===m.id&&f.month===mon&&f.status==='Paid');return [m.name,mon,a.reduce((s,x)=>s+Number(x.amount),0),a.length,a.map(x=>x.date).sort().reverse()[0]||'',a.length?'Paid':'Unpaid']}))}else if(type==='backup'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'khodal24c-backup.json');return}let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8;'}),'khodal24c-'+filename+'.csv')}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('File export શરૂ થયું.')}
function importBackup(e){let file=e.target.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.members)||!Array.isArray(d.users)||!Array.isArray(d.funds)||!Array.isArray(d.expenses))throw Error();modal('Import Backup?','આ backup વર્તમાન એપનો ડેટા બદલી દેશે. આગળ વધવું છે?',()=>{db=d;persist();user=db.users.find(u=>u.id===user?.id)?{id:user.id}:null;page=user?'dashboard':'login';render();toast('Backup import થયો.')})}catch(err){toast('Backup JSON માન્ય નથી.',true)}};r.readAsText(file);e.target.value=''}
function renderKeepFocus(el){let pos=el.selectionStart;render();let candidates=[...document.querySelectorAll('input')],same=candidates.find(x=>x.placeholder===el.placeholder&&x.type===el.type);if(same){same.focus();try{same.setSelectionRange(pos,pos)}catch(e){}}}
// Keep initial supplied members, but never fabricate payments, contact details, or expenses.
if(!localStorage.getItem(KEY)){persist()}
// Expose only UI event handlers.
Object.assign(window,{go,historyBack,openMore,togglePass,createAdmin,login,resetPassword,logoutConfirm,closeModal,saveFund,setFundMember,saveMember,editMemberStart,toggleMember,saveExpense,editExpenseStart,deleteExpense,updateProfile,changePassword,changeUserRole,refreshData,openWA,shareText,shareMemberReport,exportCSV,importBackup,render,renderKeepFocus});
try{let s=sessionStorage.getItem('k24c_session');if(s){let u=db.users.find(x=>x.id===s);if(u)user={id:u.id}}}catch(e){}if(user)page='dashboard';else page=db.setup?'login':'setup';render();
// Persist login across refresh in this browser session, never across an explicit logout.
const oldLogin=window.login;window.login=function(e){oldLogin(e);if(user)try{sessionStorage.setItem('k24c_session',user.id)}catch(err){}};
const oldLogout=window.logoutConfirm;window.logoutConfirm=function(){modal('Logout કરવું છે?','શું તમે Khodal 24C Team માંથી Logout કરવા માંગો છો?',()=>{try{sessionStorage.removeItem('k24c_session')}catch(e){}user=null;page='login';selectedMember=null;render();toast('Logout થઈ ગયું.')})};
})();
</script></body></html>
